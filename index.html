<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Habits β</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Habits β">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root {
  color-scheme: light dark;
  --bg: #f2f2f7; --card: #ffffff; --text: #000000; --text2: #8e8e93; --text3: #c7c7cc;
  --sep: rgba(60,60,67,0.29); --fill: rgba(120,120,128,0.12); --fill2: rgba(120,120,128,0.2);
  --tint: #007aff; --danger: #ff3b30; --shadow: 0 10px 40px rgba(0,0,0,0.18);
  --sheet-bg: #f2f2f7; --card-elev: #ffffff; --bar: rgba(249,249,249,0.94);
  --c-red:#ff3b30; --c-orange:#ff9500; --c-yellow:#ffcc00; --c-green:#34c759; --c-mint:#00c7be; --c-teal:#30b0c7;
  --c-cyan:#32ade6; --c-blue:#007aff; --c-indigo:#5856d6; --c-purple:#af52de; --c-pink:#ff2d55; --c-brown:#a2845e;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --card: #1c1c1e; --text: #ffffff; --text2: #8e8e93; --text3: #48484a;
    --sep: rgba(84,84,88,0.65); --fill: rgba(120,120,128,0.24); --fill2: rgba(120,120,128,0.36);
    --tint: #0a84ff; --danger: #ff453a; --shadow: 0 10px 40px rgba(0,0,0,0.6);
    --sheet-bg: #1c1c1e; --card-elev: #2c2c2e; --bar: rgba(22,22,22,0.94);
    --c-red:#ff453a; --c-orange:#ff9f0a; --c-yellow:#ffd60a; --c-green:#30d158; --c-mint:#63e6e2; --c-teal:#40c8e0;
    --c-cyan:#64d2ff; --c-blue:#0a84ff; --c-indigo:#5e5ce6; --c-purple:#bf5af2; --c-pink:#ff375f; --c-brown:#ac8e68;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  position: fixed; inset: 0; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  font-size: 17px; line-height: 1.3;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
  overscroll-behavior: none; touch-action: manipulation;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
a { color: var(--tint); text-decoration: none; }
#app { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.nav { display: flex; align-items: center; gap: 4px; padding: calc(var(--sat) + 6px) 12px 4px; min-height: calc(var(--sat) + 50px); }
.nav .spacer { flex: 1; }
.navbtn { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; color: var(--tint); font-size: 17px; border-radius: 22px; padding: 0 6px; gap: 2px; }
.navbtn:active { opacity: .5; }
.navbtn svg { width: 24px; height: 24px; }
.navbtn.strong { font-weight: 600; }
.content { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px; padding-bottom: calc(var(--sab) + 40px); overscroll-behavior: contain; }
.title-lg { font-size: 34px; font-weight: 700; letter-spacing: -.4px; margin: 4px 0 10px; display: flex; align-items: baseline; gap: 10px; }
.title-lg .count { font-size: 34px; font-weight: 700; color: var(--text2); margin-left: auto; }
.section { font-size: 22px; font-weight: 700; margin: 26px 0 10px; }
.card { background: var(--card); border-radius: var(--radius); overflow: hidden; }
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* level header */
.levelcard { padding: 6px 2px 2px; }
.levelcard .row1 { display: flex; align-items: baseline; }
.levelcard .lvl { font-size: 22px; font-weight: 700; }
.levelcard .xp { margin-left: auto; color: var(--text2); font-size: 14px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--fill2); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--tint); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.bar.thin { height: 4px; margin-top: 4px; }

/* smart tiles */
.smart { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.tile { background: var(--card); border-radius: var(--radius); padding: 10px 12px 10px; display: flex; flex-direction: column; min-height: 78px; color: inherit; }
.tile:active { opacity: .6; }
.tile .top { display: flex; align-items: center; justify-content: space-between; }
.tile .ic { width: 32px; height: 32px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; color: #fff; }
.tile .ic svg { width: 20px; height: 20px; }
.tile .n { font-size: 26px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.tile .lbl { color: var(--text2); font-weight: 600; margin-top: auto; font-size: 16px; }

/* category rows */
.catrow { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; min-height: 52px; color: inherit; position: relative; }
.catrow:active { background: var(--fill); }
.catrow + .catrow::before { content: ''; position: absolute; left: 60px; right: 0; top: 0; height: .5px; background: var(--sep); }
.catic { width: 32px; height: 32px; border-radius: 16px; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; }
.catrow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.catrow .right { color: var(--text2); display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.catrow .right svg { width: 14px; height: 14px; color: var(--text3); stroke-width: 2.4; }
.chev { color: var(--text3); }
.addlist { margin: 12px 0 0; }
.addlist button { color: var(--tint); font-weight: 600; padding: 12px 4px; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
.addlist svg { width: 22px; height: 22px; }

/* banner (backup nudge) */
.nudge { margin-top: 14px; background: var(--card); border-radius: var(--radius); padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.nudge .t { flex: 1; font-size: 15px; }
.nudge .t b { display: block; }
.nudge button { color: var(--tint); font-weight: 600; min-height: 44px; padding: 0 6px; }

/* item rows */
.swipe { position: relative; overflow: hidden; background: var(--card); }
.row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 16px 10px 12px; background: var(--card); position: relative; z-index: 1; transition: transform .25s cubic-bezier(.2,.8,.2,1); touch-action: pan-y; will-change: transform; }
.swipe.swiping .row { transition: none; }
.swipe.open .row { transform: translateX(-88px); }
.swipe:not(:last-child) .row::after { content: ''; position: absolute; left: 54px; right: 0; bottom: 0; height: .5px; background: var(--sep); }
.row.sub { padding-left: 44px; }
.swipe:not(:last-child) .row.sub::after { left: 86px; }
.checkwrap { width: 44px; height: 44px; margin: -11px -8px -11px -8px; flex: none; display: inline-flex; align-items: center; justify-content: center; }
.check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--text3); position: relative; transition: background .15s, border-color .15s, transform .15s; --c: var(--tint); }
.check.done { background: var(--c); border-color: var(--c); }
.check.done::after { content: ''; position: absolute; left: 6.5px; top: 2.5px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.check.partial { border-color: var(--c); }
.check.partial::after { content: attr(data-n); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--c); }
.checkwrap:active .check { transform: scale(.9); }
.row .body { flex: 1; min-width: 0; padding-top: 1px; }
.row .txt { word-wrap: break-word; }
.row.done .txt { color: var(--text2); }
.row .meta { color: var(--text2); font-size: 13px; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.row .meta .over { color: var(--danger); }
.row .meta .dot { width: 8px; height: 8px; border-radius: 4px; display: inline-block; margin-right: 4px; vertical-align: middle; }
.row .meta .chip { background: var(--fill); border-radius: 6px; padding: 0 5px; font-size: 12px; font-weight: 600; }
.row-del { position: absolute; top: 0; right: 0; bottom: 0; width: 88px; z-index: 0; background: var(--danger); color: #fff; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.group-h { color: var(--text2); font-size: 13px; text-transform: uppercase; letter-spacing: .4px; margin: 20px 0 6px 16px; font-weight: 600; }
.group-h.first { margin-top: 8px; }
.empty { color: var(--text2); text-align: center; padding: 40px 20px; font-size: 16px; }

/* new item row */
.newwrap { flex: none; padding: 8px 16px calc(var(--sab) + 8px); background: var(--bg); border-top: .5px solid var(--sep); }
.newrow { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: var(--radius); padding: 4px 4px 4px 12px; min-height: 48px; }
.newrow .plus { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--tint); color: #fff; flex: none; }
.newrow .plus svg { width: 16px; height: 16px; stroke-width: 2.6; }
.newrow input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 17px; padding: 8px 0; }
.newrow input::placeholder { color: var(--text2); }
.newrow .cam { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--tint); border-radius: 22px; }
.newrow .cam svg { width: 26px; height: 26px; }
.hint { color: var(--text2); font-size: 13px; padding: 6px 12px 0; min-height: 0; }
.hint:empty { display: none; }

/* sheets */
#sheet-root:empty { display: none; }
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); animation: fade .2s; z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: calc(100% - var(--sat) - 12px); background: var(--sheet-bg); --card: var(--card-elev); border-radius: 14px 14px 0 0; z-index: 41; display: flex; flex-direction: column; animation: up .3s cubic-bezier(.2,.8,.2,1); box-shadow: var(--shadow); }
.sheet::before { content: ''; position: absolute; top: 6px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--fill2); }
.sheet.tall { height: calc(100% - var(--sat) - 12px); }
.sheet-head { display: flex; align-items: center; padding: 6px 8px; min-height: 52px; flex: none; }
.sheet-head .t { flex: 1; text-align: center; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-head .navbtn { min-width: 60px; justify-content: flex-start; }
.sheet-head .navbtn.right { justify-content: flex-end; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px calc(var(--sab) + 24px); flex: 1; min-height: 0; overscroll-behavior: contain; }
.grp { background: var(--card); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }
.grp + .grp { margin-top: -4px; }
.fld { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 46px; position: relative; }
.fld + .fld::before, .fld + .fldc::before, .fldc + .fld::before { content: ''; position: absolute; left: 16px; right: 0; top: 0; height: .5px; background: var(--sep); }
.fld .l { flex: 1; min-width: 0; }
.fld .v { color: var(--text2); text-align: right; }
.fld input[type=text], .fld input[type=number], .fld input[type=password], .fld input[type=date], .fld select, .fld textarea { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 17px; padding: 4px 0; }
.fld input[type=date] { text-align: right; color: var(--tint); -webkit-appearance: none; appearance: none; }
.fld select { text-align: right; color: var(--text2); -webkit-appearance: none; appearance: none; direction: rtl; padding-right: 2px; }
.fld select option { direction: ltr; }
.fld textarea { resize: none; line-height: 1.35; padding: 6px 0; }
.fld .big { font-size: 20px; font-weight: 600; }
.fld input::placeholder, .fld textarea::placeholder { color: var(--text2); }
.fld .action { color: var(--tint); }
.fld .danger { color: var(--danger); }
.fld.tap:active { background: var(--fill); }
.fldc { padding: 10px 16px 12px; position: relative; }
.seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin: 4px 0; }
.seg button { flex: 1; min-height: 32px; border-radius: 7px; font-size: 14px; font-weight: 500; color: var(--text); }
.seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.seg.tiers button { flex-direction: column; display: flex; align-items: center; padding: 4px 0; }
.seg.tiers small { font-size: 10px; color: var(--text2); font-weight: 500; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.chips button { min-width: 40px; height: 34px; padding: 0 10px; border-radius: 17px; background: var(--fill); font-size: 14px; font-weight: 600; }
.chips button.on { background: var(--tint); color: #fff; }
.stepper { display: inline-flex; align-items: center; background: var(--fill); border-radius: 8px; overflow: hidden; }
.stepper button { width: 40px; height: 32px; font-size: 20px; }
.stepper span { min-width: 34px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; padding: 12px 16px; }
.swatches button { width: 40px; height: 40px; border-radius: 20px; margin: 0 auto; position: relative; }
.swatches button.on::after { content: ''; position: absolute; inset: -5px; border: 3px solid var(--text3); border-radius: 50%; }
.emojis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; padding: 12px 16px; }
.emojis button { width: 44px; height: 44px; border-radius: 22px; font-size: 24px; margin: 0 auto; }
.emojis button.on { background: var(--fill2); }
.catpreview { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 16px 8px; }
.catpreview .big { width: 88px; height: 88px; border-radius: 44px; font-size: 48px; display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
.catpreview input { width: 100%; text-align: center; font-size: 22px; font-weight: 600; border: 0; background: var(--fill); border-radius: 10px; padding: 10px; outline: none; }
.btn { display: block; width: 100%; text-align: center; padding: 13px; font-weight: 600; border-radius: var(--radius); background: var(--card); color: var(--tint); min-height: 48px; }
.btn.danger { color: var(--danger); }
.btn.primary { background: var(--tint); color: #fff; }
.btn.primary:disabled { opacity: .4; }
.btn + .btn { margin-top: 12px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 16px; text-align: center; }
.stats .n { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stats .l { color: var(--text2); font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
.subrow { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; min-height: 44px; position: relative; }
.subrow + .subrow::before { content: ''; position: absolute; left: 44px; right: 0; top: 0; height: .5px; background: var(--sep); }
.subrow .body { flex: 1; min-width: 0; }
.subrow .body .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subrow.done .txt { color: var(--text2); }
.subrow .chip { background: var(--fill); border-radius: 6px; padding: 0 5px; font-size: 12px; font-weight: 600; color: var(--text2); }
.subrow input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 17px; }
.subrow .chev { width: 18px; height: 18px; }
.note { color: var(--text2); font-size: 13px; padding: 0 16px 8px; margin-top: -12px; line-height: 1.35; }
.menu { padding: 8px 16px calc(var(--sab) + 16px); }
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 0 16px; background: var(--card); font-size: 18px; }
.menu button + button { border-top: .5px solid var(--sep); }
.menu button svg { width: 24px; height: 24px; color: var(--tint); }
.menu button.danger { color: var(--danger); }
.menu .grp { margin-bottom: 10px; }

/* capture review */
.rv { display: flex; gap: 6px; padding: 10px 12px 10px 6px; position: relative; }
.rv + .rv::before { content: ''; position: absolute; left: 48px; right: 0; top: 0; height: .5px; background: var(--sep); }
.rv.off .rv-body { opacity: .45; }
.rv-check { width: 42px; flex: none; display: flex; align-items: flex-start; justify-content: center; padding-top: 7px; }
.rv-check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.rv-check .check { --c: var(--tint); }
.rv-check input:checked + .check { background: var(--c); border-color: var(--c); }
.rv-check input:checked + .check::after { content: ''; position: absolute; left: 6.5px; top: 2.5px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.rv-body { flex: 1; min-width: 0; }
.rv-body input[type=text] { width: 100%; border: 0; background: none; outline: none; font-size: 17px; padding: 4px 0; }
.rv-dup { color: var(--c-orange); font-size: 13px; margin-top: 2px; }
.rv-ctl { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
.rv-ctl select, .rv-ctl button, .rv-ctl input { font-size: 13px; font-weight: 500; background: var(--fill); border: 0; border-radius: 8px; padding: 0 9px; color: var(--text); -webkit-appearance: none; appearance: none; min-height: 30px; max-width: 46%; }

/* achievements */
.ach { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 60px; position: relative; color: inherit; width: 100%; text-align: left; }
.ach + .ach::before { content: ''; position: absolute; left: 68px; right: 0; top: 0; height: .5px; background: var(--sep); }
.ach:active { background: var(--fill); }
.ach .ic { width: 40px; height: 40px; border-radius: 20px; background: var(--fill); font-size: 22px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.ach.on .ic { background: linear-gradient(135deg, #ffd60a, #ff9f0a); box-shadow: 0 2px 8px rgba(255,159,10,.35); }
.ach .body { flex: 1; min-width: 0; }
.ach .nm { font-weight: 600; }
.ach .sub { color: var(--text2); font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.ach.on .sub { color: var(--text2); }
.ach .bar { margin-top: 6px; }

/* toasts / banners */
.toast { position: fixed; left: 50%; bottom: calc(var(--sab) + 84px); transform: translateX(-50%); background: rgba(30,30,32,.92); color: #fff; padding: 10px 18px; border-radius: 22px; font-weight: 600; z-index: 60; display: flex; align-items: center; gap: 14px; animation: pop .25s cubic-bezier(.2,.8,.2,1); box-shadow: 0 6px 20px rgba(0,0,0,.25); width: max-content; max-width: calc(100% - 32px); text-align: center; font-size: 15px; }
.toast.xp { background: var(--tint); font-size: 18px; white-space: nowrap; }
.toast.out { animation: popout .2s forwards; }
.toast button { color: #ffd60a; font-weight: 700; padding: 6px 0; }
.banner { position: fixed; left: 16px; right: 16px; top: calc(var(--sat) + 10px); background: var(--card); border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 14px; z-index: 61; box-shadow: var(--shadow); animation: drop .4s cubic-bezier(.2,.8,.2,1); }
.banner.out { animation: rise .25s forwards; }
.banner .ic { width: 44px; height: 44px; border-radius: 22px; background: linear-gradient(135deg, #ffd60a, #ff9f0a); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; animation: glow 1.2s ease-in-out infinite; flex: none; }
.banner .k { color: var(--text2); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
.banner .v { font-weight: 700; font-size: 18px; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(100%); } }
@keyframes pop { from { transform: translateX(-50%) translateY(12px) scale(.9); opacity: 0; } }
@keyframes popout { to { transform: translateX(-50%) translateY(8px); opacity: 0; } }
@keyframes drop { from { transform: translateY(-120%); opacity: 0; } }
@keyframes rise { to { transform: translateY(-120%); opacity: 0; } }
@keyframes glow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* tab bar (Lists | Skills) */

.switch:checked { background: var(--c-green); }

/* completion celebration: check pop, floating +XP, boost card */
.check.pop { animation: checkPop .45s cubic-bezier(.2,1.6,.4,1); }
.check.pop::before { content: ''; position: absolute; inset: -7px; border-radius: 50%; border: 2px solid var(--c); opacity: 0; animation: ring .55s ease-out; pointer-events: none; }

@keyframes boostIn { from { transform: translateY(36px) scale(.9); opacity: 0; } }

<body>
<div id="app"><div class="screen"><div class="center" style="padding-top:40vh"><div class="spinner"></div></div></div></div>
<div id="sheet-root"></div>

<script src="game.js"></script>
<script>
'use strict';
const APP_VERSION = '1.2.0';
// 'stable' for the live app; 'beta' for the side-by-side test copy (own database, name, icon and cache).
const CHANNEL = 'beta';
const IS_BETA = CHANNEL === 'beta';
const APP_NAME = IS_BETA ? 'Habits β' : 'Habits';

// ---------- utilities ----------
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtNum = n => Number(n || 0).toLocaleString('en-US');
const nowIso = () => new Date().toISOString();
const IS_IOS_TAB = navigator.standalone === false;

const DB = (() => {
  // v2 adds `skills`, v3 adds `reviews`. The beta keeps its own database so it never touches the live app's data.
  const NAME = IS_BETA ? 'habit-tracker-beta' : 'habit-tracker', VERSION = 3;
  const STORES = ['categories', 'items', 'completions', 'achievements', 'settings', 'secrets', 'skills', 'reviews'];
  let dbp = null;

    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open(NAME, VERSION);
      r.onupgradeneeded = () => { const d = r.result; for (const s of STORES) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); };
      r.onsuccess = () => { const d = r.result; d.onversionchange = () => d.close(); res(d); };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('The app is open in another tab. Close it and reload.'));
    });
    return dbp;
  }

    const d = await open();
    return new Promise((res, rej) => { const q = d.transaction(store, 'readonly').objectStore(store).getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error); });
  }

  async function write(ops) {
    if (!ops.length) return;
    const d = await open();
    const stores = [...new Set(ops.map(o => o.store))];
    return new Promise((res, rej) => {

      for (const o of ops) { const s = t.objectStore(o.store); if (o.clear) s.clear(); else if (o.del !== undefined) s.delete(o.del); else s.put(o.put); }

function updateItem(id, patch) {

function quickAddSheet(catId) {

    const cat = catById(d.categoryId);

  };
  const sheet = {
    kind: 'quick-add', draft: d, title: 'New Reminder', left: 'Cancel', right: 'Add',
    render() {
      const cats = sortedCats().map(c => `<option value="${c.id}" ${c.id === d.categoryId ? 'selected' : ''}>${esc(c.icon)} ${esc(c.name)}</option>`).join('');
      const custom = d.due && d.due !== tk && d.due !== Game.addDays(tk, 1);
      const dues = [['None', ''], ['Today', tk], ['Tomorrow', Game.addDays(tk, 1)]].map(([l, v]) => `<button class="${(d.due || '') === v ? 'on' : ''}" data-act="qa-due" data-v="${v}">${l}</button>`).join('') +

      return `<div class="grp"><div class="fld"><input type="text" id="qa-text" class="big" value="${esc(d.text)}" placeholder="Title" autocapitalize="sentences" autocomplete="off" enterkeyhint="done"></div><div class="fld"><textarea id="qa-notes" rows="2" placeholder="Notes">${esc(d.notes)}</textarea></div></div>
        <div class="hint" id="qa-hint" style="margin:-14px 0 14px"></div>
        <div class="grp"><div class="fld"><span class="l">List</span><select id="qa-cat" aria-label="List">${cats}</select></div>
        <div class="fldc"><span class="l">Due</span><div class="chips">${dues}</div><input type="date" id="qa-date" style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none"></div></div>
        <div class="note">Tokens work here too: <b>!3</b> tier · <b>+clarity</b> skill · <b>@fri</b> due · <b>^daily</b> makes it a habit.</div>
        <div class="grp"><button class="fld tap" data-act="qa-capture" style="width:100%;text-align:left"><span class="l action" style="display:flex;align-items:center;gap:8px">${ICONS.camera} Scan a note card instead</span></button></div>
        ${d.added.length ? `<div class="note" id="qa-added" style="margin-top:0">Added: ${d.added.map(esc).join(', ')}</div>` : ''}`;
    },
    mounted(root) {
      const t = root.querySelector('#qa-text');
      const hint = () => { const h = root.querySelector('#qa-hint'); if (!h) return; const p = parse(); h.textContent = p.text || p.tokens.length ? hintFor(p, {}) : ''; };
      t.addEventListener('input', () => { d.text = t.value; hint(); });
      t.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (sheet.add()) { Sheet.rerender(); const n = $('#qa-text'); if (n) n.focus(); } } });
      root.querySelector('#qa-notes').addEventListener('input', e => { d.notes = e.target.value; });
      root.querySelector('#qa-cat').addEventListener('change', e => { d.categoryId = e.target.value; hint(); });
      const pick = root.querySelector('#qa-date'); pick.addEventListener('change', () => { if (pick.value) { d.due = pick.value; Sheet.rerender(); } });
      hint();
      setTimeout(() => { const n = root.querySelector('#qa-text'); if (n && document.activeElement !== n) n.focus(); }, 50);
    },
    flush() { const t = $('#qa-text'); if (t) d.text = t.value; const n = $('#qa-notes'); if (n) d.notes = n.value; },
    add() {
      const p = parse();
      if (!p.text) return false;
      const it = addItem({
        text: p.text, notes: d.notes, tier: p.tier || Game.DEFAULT_TIER, categoryId: p.categoryId || d.categoryId,
        skillId: p.skillId, skillSource: p.skillId ? 'user' : null,
        type: p.repeat ? 'habit' : 'task', repeat: p.repeat, timesPerDay: p.timesPerDay || 1,
        due: p.repeat ? null : (p.due || d.due || null)
      });
      d.added.push(it.text); d.text = ''; d.notes = '';
      return true;
    },
    done() {
      this.add();
      const n = d.added.length;
      if (n) toast(n === 1 ? `Added “${d.added[0]}”` : `Added ${n} reminders`);
      return true;
    }
  };
  return sheet;
}

// ---------- sheets ----------
const Sheet = {
  stack: [], root: $('#sheet-root'),
  push(entry) { Boost.hide(); this.stack.push(entry); history.pushState({ sheet: this.stack.length }, ''); this.rerender(); },
  replace(entry) { this.stack[this.stack.length - 1] = entry; this.rerender(); },
  pop() { if (!this.stack.length) return; history.back(); },
  closeAll() { if (this.stack.length) history.go(-this.stack.length); },
  top() { return this.stack[this.stack.length - 1] || null; },
  shown: null,
  rerender() {

function loadImage(file) {

    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read that image')); };
    img.src = url;
  });
}
async function prepareImage(file, maxEdge = 1568) {
  const img = await loadImage(file);
  const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
  const scale = Math.min(1, maxEdge / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
  const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  const blob = await new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error('Could not compress the image')), 'image/jpeg', 0.85));

}

// ---------- Claude skill check (background) ----------
// Typed items get an instant keyword guess; this re-checks them with Claude in small batches.
// Your own picks (skillSource 'user') are never touched. Failures are silent and retried later.
const SkillAI = {
  timer: null, running: false, lastError: null, lastRunAt: null,
  enabled() { return !!(S.apiKey && S.settings && S.settings.aiSkillCheck !== false && S.skills.length); },
  pending() { return S.items.filter(i => i.skillSource !== 'user' && !i.aiCheckedAt && String(i.text || '').trim()); },
  schedule(delay) {
    if (!this.enabled()) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.run().catch(() => {}), delay === undefined ? 2500 : delay);
  },
  async run() {
    if (this.running || !this.enabled() || navigator.onLine === false) return null;
    const batch = this.pending().slice(0, 40);
    if (!batch.length) return null;
    this.running = true;
    const sentText = new Map(batch.map(i => [i.id, i.text]));
    try {
      const body = Game.buildSkillRequest(S.settings.model || Game.DEFAULT_MODEL, sortedSkills(), batch, Game.byId(S.items));
      const resp = await fetch(API_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-api-key': S.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify(body)
      });
      if (!resp.ok) {
        let msg = `API error ${resp.status}`;
        try { const j = await resp.json(); if (j.error && j.error.message) msg = j.error.message; } catch (e) { /* ignore */ }
        if (resp.status === 401) msg = 'Key rejected — check it in Settings.';
        throw new Error(msg);
      }
      const result = Game.parseSkillResponse(await resp.json(), S.skills, batch.map(i => i.id));
      if (!result) throw new Error('Claude returned no skill assignments.');
      const summary = applySkillResults(batch, sentText, result);
      this.lastError = null;
      this.lastRunAt = nowIso();
      if (this.pending().length) this.schedule(400);
      return summary;
    } catch (e) {
      this.lastError = (e && e.message) || String(e);
      console.warn('skill check failed:', this.lastError);
      throw e;
    } finally {
      this.running = false;
      const st = $('#skillstatus'); if (st) st.textContent = skillStatusText();
    }
  }
};
function applySkillResults(batch, sentText, result) {
  const picked = new Map(result.map(r => [r.id, r.skillId]));
  const t = nowIso();
  const before = TOTALS;
  const ops = [];
  const lateGains = [];
  let moved = 0;
  for (const sent of batch) {
    const it = itemById(sent.id);
    if (!it || it.skillSource === 'user') continue;     // deleted, or you picked one meanwhile
    if (it.text !== sentText.get(it.id)) continue;       // renamed meanwhile: stays pending
    const sid = picked.get(it.id);
    if (sid && sid !== it.skillId) {
      const recentNull = S.completions.filter(c => c.itemId === it.id && !c.skillId && Date.now() - Date.parse(c.at) < 10 * 60000);
      reassignSkill(it, sid, 'ai', { ops, checkedAt: t });
      for (const c of recentNull) lateGains.push(c);
      moved++;
    } else {
      it.aiCheckedAt = t;
      if (sid) it.skillSource = 'ai';
      ops.push({ store: 'items', put: it });
    }
  }
  persist(ops);
  recompute();
  // A check-off that happened before its skill was known gets its celebration now.
  if (lateGains.length) Boost.show(gainsBySkill(lateGains), before, TOTALS);
  if (moved) {
    runAchievementChecks();
    const r = route();
    if (!Sheet.top()) softRender();
    else if (r.view === 'list') refreshListBody();
  }
  return { checked: batch.length, moved };
}
function skillStatusText() {
  if (!S.apiKey) return 'needs API key';
  if (S.settings.aiSkillCheck === false) return 'off';
  if (SkillAI.running) return 'checking…';
  if (SkillAI.lastError) return 'last check failed';
  const n = SkillAI.pending().length;
  return n ? `${n} waiting` : 'up to date';
}
async function recheckAllSkills() {
  if (!S.apiKey) { toast('Add your API key first'); return; }
  if (navigator.onLine === false) { toast('You’re offline — try again when connected'); return; }
  if (S.settings.aiSkillCheck === false) saveSettings({ aiSkillCheck: true });
  const ops = [];
  for (const it of S.items) if (it.skillSource !== 'user' && it.aiCheckedAt) { it.aiCheckedAt = null; ops.push({ store: 'items', put: it }); }
  if (ops.length) persist(ops);
  const total = SkillAI.pending().length;
  if (!total) { toast('Nothing to check — every item has your own pick'); return; }
  clearTimeout(SkillAI.timer);
  toast(`Checking ${total} item${total === 1 ? '' : 's'} with Claude…`);
  let moved = 0, guard = 0;
  try {
    while (SkillAI.pending().length && guard++ < 50) {
      while (SkillAI.running) await new Promise(r => setTimeout(r, 200));
      const s = await SkillAI.run();
      if (!s) break;
      moved += s.moved;
    }
    toast(moved ? `Done — ${moved} item${moved === 1 ? '' : 's'} moved to a better skill` : 'Done — every skill checks out');
  } catch (e) {
    toast(`Skill check failed: ${SkillAI.lastError || e.message}`, { ms: 4000 });
  }
  render();
}

let sw = null, suppressClickUntil = 0;
function closeAllRows(except) { document.querySelectorAll('.swipe.open').forEach(el => { if (el !== except) el.classList.remove('open'); }); }
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.swipe');
  if (!el || (e.pointerType === 'mouse' && e.button !== 0)) { if (!e.target.closest('.row-del')) closeAllRows(); return; }
  if (!el.querySelector('.row-del')) return;
  closeAllRows(el);
  sw = { el, x: e.clientX, y: e.clientY, dx: 0, decided: null, open: el.classList.contains('open') };

document.addEventListener('pointermove', e => {
  if (!sw) return;

  if (sw.decided === null) { if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return; sw.decided = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'h' : 'v'; if (sw.decided === 'h') { sw.el.classList.add('swiping'); try { sw.el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } } }
  if (sw.decided !== 'h') return;
  let x = (sw.open ? -88 : 0) + dx;
  x = Math.min(0, Math.max(-110, x));
  sw.dx = x;
  sw.el.querySelector('.row').style.transform = `translateX(${x}px)`;
});
function endSwipe() {

  sw = null;
  el.classList.remove('swiping');
  const row = el.querySelector('.row'); if (row) row.style.transform = '';
  if (decided === 'h') { suppressClickUntil = Date.now() + 350; if (dx < -44) el.classList.add('open'); else el.classList.remove('open'); }
}

    case 'onboard-habits': { const n = createPickedHabits(picker || newPicker()); finishOnboarding(); if (n) toast(`Added ${n} daily habit${n === 1 ? '' : 's'}`); break; }

      t.classList.toggle('on', picker.sel.has(k)); t.setAttribute('aria-pressed', String(picker.sel.has(k)));
      const cta = $('[data-act="onboard-habits"]');
      if (cta) { const n = pickedSuggestions(picker).length; cta.disabled = !n; cta.textContent = n ? `Add ${n} habit${n === 1 ? '' : 's'}` : 'Pick at least one'; }
      break;
    }
    case 'sugg-own': {
      const own = $('#own-habit'); if (!own || !picker || !addCustomSuggestion(picker, own.value)) break;
      if (Sheet.top() && Sheet.top().kind === 'suggest') Sheet.rerender();
      else { const box = $('#onb'); const y = box ? box.scrollTop : 0; renderOnboarding(); const b2 = $('#onb'); if (b2) b2.scrollTop = y; }
      break;
    }
    case 'capture': openCaptureMenu(t.dataset.cat || null); break;
    case 'toggle': toggleItem(id, t, t.dataset.date || null); break;
    case 'toggle-sheet': toggleItem(id, t); break;
    case 'locked': lockedToast(t.dataset.date, todayKey()); break;
    case 'open': Sheet.push(itemSheet(id)); break;
    case 'open-sub': flushSheetInputs(); Sheet.push(itemSheet(id)); break;
    case 'delete': deleteItem(id); render(); break;
    case 'uncomplete': removeCompletions([t.dataset.cid]); render(); break;
    case 'add-list': Sheet.push(categorySheet(null)); break;
    case 'list-menu': Sheet.push(menuSheet(catById(id) ? catById(id).name : 'List', [
      { label: 'Edit List', icon: ICONS.settings, replace: true, run: () => Sheet.replace(categorySheet(id)) },
      { label: 'Delete List', icon: ICONS.trash, danger: true, run: () => { if (deleteListPrompt(id)) setTimeout(() => go(backRoot().href), 80); } }
    ])); break;
    // planner, quick add, day lists
    case 'quick-add': Sheet.push(quickAddSheet(t.dataset.cat || null)); break;
    case 'qa-due': { const s = Sheet.top(); s.flush(); s.draft.due = t.dataset.v || null; Sheet.rerender(); break; }
    case 'qa-due-pick': { const p = $('#qa-date'); if (p) { try { p.showPicker(); } catch (err) { p.click(); } } break; }
    case 'qa-capture': { const s = Sheet.top(); s.flush(); Sheet.replace(captureMenuSheet(s.draft.categoryId)); break; }
    case 'planner-edit': Sheet.push(plannerEditSheet()); break;
    case 'planner-setup-dismiss': saveSettings({ plannerSetupDismissed: true }); render(); break;
    case 'day-lists': createDayLists(t.dataset.kind); break;
    // habits
    case 'habit-new': Sheet.push(habitSheet()); break;
    case 'habit-suggest': Sheet.push(suggestSheet()); break;
    case 'merge-habits': mergePrompt(t.dataset.key); break;
    case 'h-kind': { const s = Sheet.top(); s.flush(); s.draft.kind = t.dataset.v; Sheet.rerender(); break; }
    case 'h-day': {
      const s = Sheet.top(); s.flush(); const d = s.draft, v = +t.dataset.v;
      if (d.kind === 'weekly') d.weekly = v; else d.days = d.days.includes(v) ? d.days.filter(x => x !== v) : d.days.concat(v);
      Sheet.rerender(); break;
    }
    case 'h-tpd': { const s = Sheet.top(); s.flush(); s.draft.timesPerDay = Math.min(99, Math.max(1, s.draft.timesPerDay + (+t.dataset.v))); Sheet.rerender(); break; }
    case 'h-tier': { const s = Sheet.top(); s.flush(); s.draft.tier = +t.dataset.v; Sheet.rerender(); break; }
    // review
    case 'review-tab': flushReviewSave(); RV.tab = t.dataset.v; render(); scrollTop(); break;
    case 'review-year': { flushReviewSave(); const ys = Game.reviewYears(S.completions, todayKey(), S.reviews); const y = ys[ys.indexOf(RV.year) + (+t.dataset.v)]; if (y) { RV.year = y; render(); } break; }
    case 'review-open': RV.tab = t.dataset.kind; RV.year = +t.dataset.year; break; // the link navigates
    case 'review-dismiss': saveSettings({ reviewDismissed: Object.assign({}, S.settings.reviewDismissed, { [t.dataset.id]: true }) }); render(); break;
    case 'review-share': shareReview(); break;
    case 'review-complete': toggleReviewComplete(); break;
    case 'value-new': Sheet.push(valueSheet(null)); break;
    case 'value-open': flushReviewSave(); Sheet.push(valueSheet(id)); break;
    case 'value-suggest': { const s = Sheet.top(); const v = Game.VALUE_SUGGESTIONS.find(x => x.name === t.dataset.v); if (!v) break; Object.assign(s.draft, { name: v.name, questions: v.questions, skillIds: v.skillIds.filter(x => skillById(x)) }); Sheet.rerender(); break; }
    case 'value-skill': { const s = Sheet.top(); s.flush(); const d = s.draft; d.skillIds = d.skillIds.includes(t.dataset.v) ? d.skillIds.filter(x => x !== t.dataset.v) : d.skillIds.concat(t.dataset.v); Sheet.rerender(); break; }
    case 'value-delete': { const s = Sheet.top(); if (!confirm(`Delete the value “${s.draft.name}”? Notes you wrote for it stay in past reports' backups only.`)) break; saveSettings({ coreValues: (S.settings.coreValues || []).filter(v => v.id !== s.draft.id) }); Sheet.pop(); break; }
    case 'menu-pick': { const m = Sheet.top(); const entry = m && m.entries && m.entries[+t.dataset.i]; if (!entry) break; if (entry.replace) { entry.run(); } else { Sheet.pop(); entry.run(); } break; } // run stays inside the user gesture (camera, clipboard)
    case 'sheet-left': case 'sheet-backdrop': Sheet.pop(); break;
    case 'sheet-right': { const s = Sheet.top(); if (!s) break; if (s.flush) s.flush(); if (s.done) { const r = s.done(); if (r === false || r === 'replaced') break; } Sheet.pop(); break; }
    // capture
    case 'capture-retry': { const s = Sheet.top(); if (s && s.retry) s.retry(); break; }
    case 'rv-due': Sheet.top().draft.due = t.dataset.v || null; Sheet.rerender(); break;
    case 'rv-due-pick': { const p = $('#rv-date'); if (p) { try { p.showPicker(); } catch (e) { p.click(); } } break; }
    case 'rv-type': { const s = Sheet.top(); const x = s.draft[t.dataset.list][+t.dataset.i]; x.type = x.type === 'habit' ? 'task' : 'habit'; Sheet.rerender(); break; }
    case 'rv-add': { const s = Sheet.top(); const n = s.add(); Sheet.pop(); toast(`Added ${n} item${n === 1 ? '' : 's'}`); render(); break; }
    // item sheet fields
    case 'f-tier': updateItem(Sheet.top().id, { tier: +t.dataset.v }); Sheet.rerender(); refreshListBody(); break;
    case 'f-type': { const it = itemById(Sheet.top().id); if (!it || it.type === t.dataset.v) break; flushSheetInputs(); updateItem(it.id, t.dataset.v === 'habit' ? { type: 'habit', repeat: { kind: 'daily' }, due: null } : { type: 'task', repeat: null, timesPerDay: 1, categoryId: it.categoryId || defaultCategoryId() }); Sheet.rerender(); refreshListBody(); break; }
    case 'f-repeat': { const it = itemById(Sheet.top().id); if (!it) break; const kind = t.dataset.v; const days = kind === 'daily' ? Game.ALL_DAYS.slice() : kind === 'weekly' ? [it.repeat.days.length === 1 ? it.repeat.days[0] : Game.weekdayOf(todayKey())] : (it.repeat.days.length === 7 ? [1, 2, 3, 4, 5] : it.repeat.days); updateItem(it.id, { repeat: { kind, days } }); Sheet.rerender(); refreshListBody(); break; }
    case 'f-day': { const it = itemById(Sheet.top().id); if (!it) break; const d = +t.dataset.v; let days = it.repeat.days.slice(); if (it.repeat.kind === 'weekly') days = [d]; else if (days.includes(d)) { if (days.length > 1) days = days.filter(x => x !== d); } else days.push(d); updateItem(it.id, { repeat: { kind: it.repeat.kind, days } }); Sheet.rerender(); refreshListBody(); break; }
    case 'f-tpd': { const it = itemById(Sheet.top().id); if (!it) break; updateItem(it.id, { timesPerDay: Math.min(99, Math.max(1, it.timesPerDay + (+t.dataset.v))) }); Sheet.rerender(); refreshListBody(); break; }
    case 'f-due-clear': updateItem(Sheet.top().id, { due: null }); Sheet.rerender(); refreshListBody(); break;
    case 'f-due-today': updateItem(Sheet.top().id, { due: todayKey() }); Sheet.rerender(); refreshListBody(); break;
    case 'f-delete': { const s = Sheet.top(); const it = itemById(s.id); if (!it) break; const n = childrenOf(it.id).length; if (n && !confirm(`Delete this and its ${n} sub-task${n === 1 ? '' : 's'}?`)) break; deleteItem(s.id); Sheet.pop(); break; }
    // category sheet
    case 'c-color': Sheet.top().draft.color = t.dataset.v; Sheet.rerender(); break;
    case 'c-icon': Sheet.top().draft.icon = t.dataset.v; Sheet.rerender(); break;
    case 'c-delete': { const s = Sheet.top(); if (deleteListPrompt(s.id)) { Sheet.pop(); setTimeout(() => go(backRoot().href), 80); } break; }
    case 'c-day': { const s = Sheet.top(); const v = +t.dataset.v; s.draft.daysTouched = true; s.draft.days = s.draft.days.includes(v) ? s.draft.days.filter(x => x !== v) : s.draft.days.concat(v).sort((a, b) => a - b); s.redrawDays(); break; }
    // skills
    case 'skill-new': Sheet.push(skillSheet(null)); break;
    case 'skill-edit': Sheet.push(skillSheet(id)); break;
    case 'sk-color': Sheet.top().draft.color = t.dataset.v; Sheet.top().draft.name = ($('#sk-name') || {}).value ?? Sheet.top().draft.name; Sheet.rerender(); break;
    case 'sk-icon': Sheet.top().draft.icon = t.dataset.v; Sheet.top().draft.name = ($('#sk-name') || {}).value ?? Sheet.top().draft.name; Sheet.rerender(); break;
    case 'sk-delete': { const s = Sheet.top(); const sk = skillById(s.id); if (!sk) break; const n = S.items.filter(i => i.skillId === sk.id).length; if (confirm(`Delete the ${sk.name} skill?${n ? ` Its ${n} item${n === 1 ? '' : 's'} will be re-sorted into other skills.` : ''} Your overall XP is kept.`)) { deleteSkill(sk.id); Sheet.pop(); setTimeout(() => go('#/skills'), 80); } break; }
    case 'recheck-skills': recheckAllSkills(); break;
    // achievements
    case 'ach-new': Sheet.push(achievementSheet(null)); break;
    case 'ach-open': Sheet.push(achievementSheet(id)); break;
    case 'a-kind': { const s = Sheet.top(); s.flush(); const d = s.draft; d.kind = t.dataset.v; if (d.kind === 'level' && !['all', 'skill', 'anySkill', 'everySkill'].includes(d.scope.type)) d.scope = { type: 'all' }; if (d.kind !== 'level' && (d.scope.type === 'anySkill' || d.scope.type === 'everySkill')) d.scope = { type: 'all' }; if (d.kind === 'streak' && d.threshold === 10) d.threshold = 7; if (d.kind === 'level' && d.threshold >= 10) d.threshold = 5; Sheet.rerender(); break; }
    case 'a-unlock': unlockManual(Sheet.top().id); Sheet.pop(); break;
    case 'a-delete': if (confirm('Delete this achievement?')) { deleteAchievement(Sheet.top().id); Sheet.pop(); } break;
    // settings
    case 'export': exportBackup(); break;
    case 'import': $('#file-import').click(); break;
    case 'erase': eraseAll(); break;
    case 'key-save': saveApiKey($('#apikey').value); break;
    case 'key-clear': clearApiKey(); break;
    case 'copy-prompt': copyPastePrompt(); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'file-import') { const f = el.files && el.files[0]; el.value = ''; if (f) importBackupFile(f); return; }
  if (el.id === 'file-photo') { const f = el.files && el.files[0]; el.value = ''; if (f) { Sheet.push(progressSheet('Reading your card…')); handlePhoto(f); } return; }
  if (el.dataset && el.dataset.page) {
    saveSettings({ pages: Object.assign({}, Game.normalizePages(S.settings.pages), { [el.dataset.page]: el.checked }) });
    render(); return;
  }
  if (el.dataset && el.dataset.plannerShow) { updateCategory(el.dataset.plannerShow, { showOnPlanner: el.checked }); render(); return; }
  if (el.dataset && el.dataset.set) {
    const k = el.dataset.set;
    if (k === 'dayStartHour') { saveSettings({ dayStartHour: +el.value }); }
    else if (k === 'defaultCategoryId') saveSettings({ defaultCategoryId: el.value });
    else if (k === 'modelPreset') { if (el.value === '__custom') { saveSettings({ model: '' }); render(); } else saveSettings({ model: el.value }); }
    else if (k === 'aiSkillCheck') { saveSettings({ aiSkillCheck: el.checked }); if (el.checked) SkillAI.schedule(500); const st = $('#skillstatus'); if (st) st.textContent = skillStatusText(); }
  }
  if (el.id === 'modelcustom') saveSettings({ model: el.value.trim() || Game.DEFAULT_MODEL });
});

// keep the layout above the iOS keyboard
if (window.visualViewport) {
  const fit = () => { const vv = window.visualViewport; app.style.height = vv.height + 'px'; app.style.top = vv.offsetTop + 'px'; };
  window.visualViewport.addEventListener('resize', fit);
  window.visualViewport.addEventListener('scroll', fit);
}
window.addEventListener('focusin', () => { setTimeout(() => window.scrollTo(0, 0), 50); });

// day rollover while the app stays open
let lastTk = null;
setInterval(() => { if (!booted) return; const tk = todayKey(); if (tk !== lastTk) { lastTk = tk; softRender(); } }, 60000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushReviewSave();
  if (document.visibilityState === 'visible' && booted) { softRender(); SkillAI.schedule(1500); }
});
window.addEventListener('online', () => { if (booted) SkillAI.schedule(1000); });

// ---------- service worker (offline + update toast) ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      const watch = worker => { if (!worker) return; worker.addEventListener('statechange', () => { if (worker.state === 'installed' && navigator.serviceWorker.controller) toast('Update ready', { action: 'Reload', onAction: () => location.reload(), ms: 12000 }); }); };
      watch(reg.installing);
      reg.addEventListener('updatefound', () => watch(reg.installing));
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    } catch (e) { console.warn('service worker registration failed', e); }
  });
}

// ---------- boot ----------
async function boot() {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* ignore */ }
  if (IS_BETA) { const b = document.createElement('div'); b.className = 'beta-badge'; b.textContent = 'BETA'; document.body.appendChild(b); }
  const [categories, items, completions, achievements, settings, secrets, skills, reviews] = await Promise.all(DB.STORES.map(s => DB.getAll(s)));
  const t = nowIso();
  S.settings = settings.find(s => s.id === 'settings') || null;
  const fresh = !S.settings && !categories.length;
  let migratedFrom = null;
  if (fresh) {
    S.settings = Game.defaultSettings(t);
    S.categories = Game.seedLists(t);
    S.skills = Game.seedSkills(t);
    S.achievements = Game.seedAchievements(t);
    S.items = []; S.completions = []; S.reviews = [];
    await persist([
      { store: 'settings', put: S.settings },
      ...S.categories.map(c => ({ store: 'categories', put: c })),
      ...S.skills.map(s => ({ store: 'skills', put: s })),
      ...S.achievements.map(a => ({ store: 'achievements', put: a }))
    ]);
  } else {
    const hadFirstLaunch = !!(S.settings && S.settings.firstLaunchAt);
    const baseSettings = S.settings || Object.assign(Game.defaultSettings(t), { schemaVersion: skills.length ? Game.SCHEMA_VERSION : 1 });
    const norm = Game.normalizeState({ settings: baseSettings, categories, skills, items, completions, achievements, reviews }, Game.dayKey(new Date(), baseSettings.dayStartHour), t);
    S.settings = norm.settings; S.categories = norm.categories; S.skills = norm.skills; S.items = norm.items; S.completions = norm.completions; S.achievements = norm.achievements; S.reviews = norm.reviews;
    if (!S.settings.firstLaunchAt) S.settings.firstLaunchAt = t;
    if (norm.migratedFrom) {
      // Upgrade in one transaction: v1 → v2 adds skills and credits history; v2 → v3 marks day lists and adds pages/reviews settings.
      migratedFrom = norm.migratedFrom;
      await persist([
        { store: 'categories', clear: true }, ...S.categories.map(c => ({ store: 'categories', put: c })),
        { store: 'skills', clear: true }, ...S.skills.map(s => ({ store: 'skills', put: s })),
        ...S.items.map(i => ({ store: 'items', put: i })),
        ...S.completions.map(c => ({ store: 'completions', put: c })),
        { store: 'achievements', clear: true }, ...S.achievements.map(a => ({ store: 'achievements', put: a })),
        { store: 'settings', put: S.settings }
      ]);
    } else if (!hadFirstLaunch) persist([{ store: 'settings', put: S.settings }]);
  }
  const key = secrets.find(s => s.id === 'anthropicKey'); S.apiKey = key ? key.value : null;
  recompute();
  lastTk = todayKey();
  lastRoot = Game.startPage(S.settings);
  booted = true;
  render();
  if (migratedFrom === 1) toast('New: Skills, Planner, Habits and Review tabs. Your history has been sorted into skills.', { ms: 5000 });
  else if (migratedFrom === 2) {
    const days = S.categories.filter(isDayList).length;
    toast(days ? `New: Planner, Habits and Review. Your ${days} day list${days === 1 ? '' : 's'} now fill with your habits.` : 'New: Planner, Habits and Review tabs.', { ms: 5000 });
  }
  SkillAI.schedule(migratedFrom ? 2500 : 1500);
}
boot().catch(err => { console.error(err); app.innerHTML = `<div class="screen"><div class="intro"><h1>Couldn't start</h1><p>${esc(err && err.message || err)}</p><p>If this keeps happening, the browser may be blocking storage (private mode?).</p></div></div>`; });
</script>
</body>
</html>
