<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>game.js tests</title>
<style>
  body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; margin: 0; padding: 20px; background: #f2f2f7; color: #000; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #fff; } .t { background: #1c1c1e; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  #summary { font-weight: 700; margin: 0 0 16px; }
  #summary.ok { color: #34c759; } #summary.bad { color: #ff3b30; }
  .t { background: #fff; border-radius: 8px; padding: 8px 12px; margin: 6px 0; }
  .t.fail { border-left: 4px solid #ff3b30; } .t.pass { border-left: 4px solid #34c759; }
  .t pre { margin: 6px 0 0; white-space: pre-wrap; color: #ff3b30; font-size: 13px; }
  .grp { font-weight: 700; margin: 18px 0 4px; color: #8e8e93; text-transform: uppercase; font-size: 12px; letter-spacing: .4px; }
</style>
</head>
<body>
<h1>game.js unit tests</h1>
<div id="summary">running…</div>
<div id="out"></div>
<script src="game.js"></script>
<script>
'use strict';
// ---------- tiny runner ----------
const tests = [];
let currentGroup = '';
function group(name) { currentGroup = name; }
function test(name, fn) { tests.push({ group: currentGroup, name, fn }); }
const assert = {
  ok(v, msg) { if (!v) throw new Error(msg || `expected truthy, got ${JSON.stringify(v)}`); },
  equal(a, b, msg) { if (a !== b) throw new Error((msg ? msg + ': ' : '') + `expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); },
  deepEqual(a, b, msg) { const x = JSON.stringify(a), y = JSON.stringify(b); if (x !== y) throw new Error((msg ? msg + ': ' : '') + `expected ${y}, got ${x}`); },
  throws(fn, msg) { let threw = false; try { fn(); } catch (e) { threw = true; } if (!threw) throw new Error(msg || 'expected an exception'); }
};
function run() {
  const out = document.getElementById('out');
  let pass = 0, fail = 0, lastGroup = null;
  const results = [];
  for (const t of tests) {
    if (t.group !== lastGroup) { const g = document.createElement('div'); g.className = 'grp'; g.textContent = t.group; out.appendChild(g); lastGroup = t.group; }
    const el = document.createElement('div');
    try { t.fn(); pass++; el.className = 't pass'; el.textContent = t.name; results.push({ name: t.group + ' › ' + t.name, ok: true }); }
    catch (e) { fail++; el.className = 't fail'; el.textContent = t.name; const pre = document.createElement('pre'); pre.textContent = e.stack || String(e); el.appendChild(pre); results.push({ name: t.group + ' › ' + t.name, ok: false, error: String(e.message || e) }); }
    out.appendChild(el);
  }
  const s = document.getElementById('summary');
  s.textContent = `${pass} passed, ${fail} failed, ${tests.length} total`;
  s.className = fail ? 'bad' : 'ok';
  window.__testResults = { pass, fail, total: tests.length, results };
}

// ---------- fixtures ----------
const G = Game;
const D = (y, m, d, h = 12, min = 0) => new Date(y, m - 1, d, h, min, 0);
let idCounter = 0;
const idGen = () => 'id' + (++idCounter);
const T0 = '2026-01-01T00:00:00.000Z';
// Lists shaped like the v1.0 seeds, so list matching (#tag, capture) has something to match.
const lists = [['cat_fitness', 'Fitness'], ['cat_learning', 'Learning'], ['cat_career', 'Career'], ['cat_finance', 'Finance'], ['cat_home', 'Home'], ['cat_social', 'Social']]
  .map(([id, name], i) => ({ id, name, color: 'blue', icon: '📋', sortOrder: i, createdAt: T0 }));
const skills = G.seedSkills(T0);
function mkState(items, completions, extra) {
  return Object.assign({ settings: G.defaultSettings(T0), categories: lists, skills, items: items || [], completions: completions || [], achievements: [] }, extra || {});
}
function task(id, extra) { return Object.assign({ id, text: id, notes: '', type: 'task', categoryId: 'cat_home', skillId: null, tier: 2, parentId: null, due: null, repeat: null, timesPerDay: 1, sortOrder: 0, createdAt: null }, extra || {}); }
function habit(id, days, extra) { return Object.assign({ id, text: id, notes: '', type: 'habit', categoryId: 'cat_fitness', skillId: null, tier: 1, parentId: null, due: null, repeat: { kind: days.length === 7 ? 'daily' : 'custom', days }, timesPerDay: 1, sortOrder: 0, createdAt: null }, extra || {}); }
const ALL = [0, 1, 2, 3, 4, 5, 6];
function comp(itemId, dayKey, extra) { return Object.assign({ id: 'c' + (++idCounter), itemId, categoryId: 'cat_fitness', skillId: null, kind: 'habit', dayKey, at: dayKey + 'T12:00:00.000Z', tier: 1, xp: 10, text: itemId }, extra || {}); }
const skillOf = text => { const r = G.inferSkill(text, skills); return r ? r.skillId : null; };

// ---------- XP & levels ----------
group('XP and levels');
test('xpForTier maps 1..5 to 10/25/50/100/200', () => { assert.deepEqual([1, 2, 3, 4, 5].map(G.xpForTier), [10, 25, 50, 100, 200]); });
test('clampTier clamps and defaults', () => { assert.equal(G.clampTier(0), 1); assert.equal(G.clampTier(9), 5); assert.equal(G.clampTier('x'), 2); assert.equal(G.clampTier(3.4), 3); assert.equal(G.xpForTier(undefined), 25); });
test('xpForLevel = round(100 · L^1.3)', () => { assert.deepEqual([1, 2, 3, 5, 10, 20].map(G.xpForLevel), [100, 246, 417, 810, 1995, 4913]); });
test('xpToReachLevel sums the curve', () => { assert.equal(G.xpToReachLevel(1), 0); assert.equal(G.xpToReachLevel(2), 100); assert.equal(G.xpToReachLevel(10), 7694); });
test('levelFromXp boundaries', () => {
  assert.deepEqual(G.levelFromXp(0), { level: 1, into: 0, needed: 100, fraction: 0 });
  assert.equal(G.levelFromXp(99).level, 1);
  assert.deepEqual(G.levelFromXp(100), { level: 2, into: 0, needed: 246, fraction: 0 });
  const l = G.levelFromXp(345); assert.equal(l.level, 2); assert.equal(l.into, 245);
  assert.equal(G.levelFromXp(346).level, 3);
  assert.equal(G.levelFromXp(7694).level, 10);
  assert.equal(G.levelFromXp(-50).level, 1);
  assert.equal(G.levelFromXp('nope').level, 1);
});
test('no level cap: large XP resolves', () => { assert.ok(G.levelFromXp(1e8).level > 100); });
test('xpTotals sums overall, per list and per skill', () => {
  const t = G.xpTotals([comp('a', '2026-01-01', { xp: 10, categoryId: 'x', skillId: 'sk_clarity' }), comp('b', '2026-01-01', { xp: 25, categoryId: 'y', skillId: null }), comp('c', '2026-01-01', { xp: 5, categoryId: 'x', skillId: 'sk_clarity' })]);
  assert.deepEqual(t, { overall: 40, byCategory: { x: 15, y: 25 }, bySkill: { sk_clarity: 15 } });
});
test('diffLevels reports overall and skill level-ups (lists never level)', () => {
  const before = { overall: 90, byCategory: { l: 90 }, bySkill: { x: 90 } }, after = { overall: 110, byCategory: { l: 110 }, bySkill: { x: 110, y: 20 } };
  assert.deepEqual(G.diffLevels(before, after), [{ type: 'levelup', scope: 'overall', id: null, level: 2 }, { type: 'levelup', scope: 'skill', id: 'x', level: 2 }]);
  assert.deepEqual(G.diffLevels(after, before), []);
});

// ---------- logical days ----------
group('Logical days');
test('dayKey rolls over at the day-start hour', () => {
  assert.equal(G.dayKey(D(2026, 9, 22, 1, 30), 4), '2026-09-21');
  assert.equal(G.dayKey(D(2026, 9, 22, 3, 59), 4), '2026-09-21');
  assert.equal(G.dayKey(D(2026, 9, 22, 4, 0), 4), '2026-09-22');
  assert.equal(G.dayKey(D(2026, 9, 22, 23, 59), 4), '2026-09-22');
  assert.equal(G.dayKey(D(2026, 9, 22, 1, 30), 0), '2026-09-22');
  assert.equal(G.dayKey(D(2026, 1, 1, 2, 0), 4), '2025-12-31');
});
test('dayKey defaults to 4 AM and accepts ISO strings', () => { assert.equal(G.dayKey(D(2026, 3, 10, 2)), '2026-03-09'); assert.equal(G.dayKey(D(2026, 3, 10, 2).toISOString(), 4), '2026-03-09'); });
test('addDays / weekdayOf / daysBetween', () => {
  assert.equal(G.addDays('2026-01-31', 1), '2026-02-01');
  assert.equal(G.addDays('2026-03-01', -1), '2026-02-28');
  assert.equal(G.weekdayOf('2026-09-23'), 3); // Wednesday
  assert.equal(G.daysBetween('2026-09-20', '2026-09-23'), 3);
  assert.equal(G.daysBetween('2026-03-07', '2026-03-09'), 2); // across US DST change
});
test('parseDay rejects invalid dates', () => { assert.equal(G.parseDay('2026-02-30'), null); assert.equal(G.isDayKey('2026-2-3'), false); assert.equal(G.isDayKey('2026-02-03'), true); });
test('dueStatus', () => {
  assert.equal(G.dueStatus(task('a', { due: '2026-09-22' }), '2026-09-23'), 'overdue');
  assert.equal(G.dueStatus(task('a', { due: '2026-09-23' }), '2026-09-23'), 'today');
  assert.equal(G.dueStatus(task('a', { due: '2026-09-24' }), '2026-09-23'), 'future');
  assert.equal(G.dueStatus(task('a'), '2026-09-23'), 'none');
  assert.equal(G.dueStatus(habit('h', ALL), '2026-09-23'), 'none');
});

// ---------- schedules ----------
group('Schedules');
test('normalizeRepeat: daily has all days, weekly one day, custom sorted unique', () => {
  assert.deepEqual(G.normalizeRepeat({ kind: 'daily' }), { kind: 'daily', days: ALL });
  assert.deepEqual(G.normalizeRepeat({ kind: 'weekly' }, '2026-09-23'), { kind: 'weekly', days: [3] });
  assert.deepEqual(G.normalizeRepeat({ kind: 'weekly', days: [5, 1] }), { kind: 'weekly', days: [5] });
  assert.deepEqual(G.normalizeRepeat({ kind: 'custom', days: [5, 1, 1, 9, -1] }), { kind: 'custom', days: [1, 5] });
  assert.deepEqual(G.normalizeRepeat({ kind: 'custom', days: [] }), { kind: 'custom', days: ALL });
  assert.deepEqual(G.normalizeRepeat({ kind: 'bogus' }), { kind: 'daily', days: ALL });
  assert.equal(G.normalizeRepeat(null), null);
});
test('isScheduledOn / prevScheduledDay', () => {
  const h = habit('h', [1, 3, 5]);
  assert.equal(G.isScheduledOn(h, '2026-09-23'), true);  // Wed
  assert.equal(G.isScheduledOn(h, '2026-09-24'), false); // Thu
  assert.equal(G.prevScheduledDay(h, '2026-09-24'), '2026-09-23');
  assert.equal(G.prevScheduledDay(h, '2026-09-23'), '2026-09-21');
  assert.equal(G.isScheduledOn(task('t'), '2026-09-23'), false);
});
test('repeatLabel', () => {
  assert.equal(G.repeatLabel(null), 'Never');
  assert.equal(G.repeatLabel({ kind: 'daily', days: ALL }), 'Daily');
  assert.equal(G.repeatLabel({ kind: 'weekly', days: [1] }), 'Weekly · Mon');
  assert.equal(G.repeatLabel({ kind: 'custom', days: [1, 2, 3, 4, 5] }), 'Weekdays');
  assert.equal(G.repeatLabel({ kind: 'custom', days: [0, 6] }), 'Weekends');
  assert.equal(G.repeatLabel({ kind: 'custom', days: [1, 3] }), 'Mon Wed');
});

// ---------- skills: inference ----------
group('Skills: picking a skill');
test('seed skills: ten, stable ids, editable fields', () => {
  assert.deepEqual(skills.map(s => s.id), ['sk_strength', 'sk_dexterity', 'sk_endurance', 'sk_vitality', 'sk_clarity', 'sk_learning', 'sk_career', 'sk_wealth', 'sk_social', 'sk_upkeep']);
  assert.ok(skills.every(s => s.name && s.icon && G.COLORS.includes(s.color) && s.hint));
});
test('your examples: journaling → Clarity, lifting → Strength, stretching → Dexterity, reading → Learning', () => {
  assert.equal(skillOf('Journaling'), 'sk_clarity');
  assert.equal(skillOf('Lifting'), 'sk_strength');
  assert.equal(skillOf('Stretching'), 'sk_dexterity');
  assert.equal(skillOf('Reading'), 'sk_learning');
});
test('word forms are matched', () => {
  assert.equal(skillOf('Journal 10 min'), 'sk_clarity');
  assert.equal(skillOf('Lift'), 'sk_strength');
  assert.equal(skillOf('Lifted heavy'), 'sk_strength');
  assert.equal(skillOf('Stretches'), 'sk_dexterity');
  assert.equal(skillOf('Meditating'), 'sk_clarity');
  assert.equal(skillOf('Running'), 'sk_endurance');
  assert.equal(skillOf('Jogging'), 'sk_endurance');
  assert.equal(skillOf('Push-ups'), 'sk_strength');
  assert.equal(skillOf('pushups x50'), 'sk_strength');
  assert.equal(skillOf("Mom's birthday gift"), 'sk_social');
});
test('everyday items land sensibly', () => {
  const want = { 'Drink water': 'sk_vitality', 'Sleep by 11': 'sk_vitality', 'Take vitamins': 'sk_vitality', 'Meditate': 'sk_clarity', 'Plan week': 'sk_clarity',
    'Study for Security+': 'sk_learning', 'Read 20 pages': 'sk_learning', 'Update resume': 'sk_career', 'Pay rent': 'sk_wealth', 'Budget review': 'sk_wealth',
    'Call mom': 'sk_social', 'Text dad': 'sk_social', 'Laundry': 'sk_upkeep', 'Renew passport': 'sk_upkeep', 'Yoga': 'sk_dexterity', 'Swimming laps': 'sk_endurance' };
  for (const [text, id] of Object.entries(want)) assert.equal(skillOf(text), id, text);
});
test('warm-ups and cool-downs count as mobility', () => {
  assert.equal(skillOf('Warm up'), 'sk_dexterity');
  assert.equal(skillOf('Cool down stretch'), 'sk_dexterity');
});
test('generic verbs yield to the specific word', () => {
  assert.equal(skillOf('Run errands'), 'sk_upkeep');
  assert.equal(skillOf('Read emails'), 'sk_career');
  assert.equal(skillOf('Call dentist'), 'sk_vitality');
  assert.equal(skillOf('Water plants'), 'sk_upkeep');
  assert.equal(skillOf('Book flight'), 'sk_upkeep');
  assert.equal(skillOf('Work out'), 'sk_strength');
  assert.equal(skillOf('Yoga class'), 'sk_dexterity');
  assert.equal(skillOf('Make bed'), 'sk_upkeep');
  assert.equal(skillOf('Clean gym bag'), 'sk_upkeep');
});
test('no match, empty input, or no skills → null', () => {
  assert.equal(skillOf('Gibberish xyz'), null);
  assert.equal(skillOf(''), null);
  assert.equal(G.inferSkill('Journal', []), null);
  assert.equal(G.inferSkill('Journal', null), null);
  assert.equal(skillOf('update'), null, 'word boundaries: "date" inside "update" must not match');
});
test('custom skills match on their name and "what counts" hint', () => {
  const mine = skills.concat([{ id: 'x', name: 'Creativity', icon: '🎨', color: 'purple', hint: 'guitar, drawing, writing songs' }]);
  assert.equal(G.inferSkill('Guitar practice', mine).skillId, 'x');
  assert.equal(G.inferSkill('Drawing', mine).skillId, 'x');
  assert.equal(G.inferSkill('creativity time', mine).skillId, 'x');
});
test('renaming a seed skill keeps its built-in keywords; deleting it removes them', () => {
  const renamed = skills.map(s => s.id === 'sk_clarity' ? Object.assign({}, s, { name: 'Mind', hint: '' }) : s);
  assert.equal(G.inferSkill('Journal', renamed).skillId, 'sk_clarity');
  const without = skills.filter(s => s.id !== 'sk_clarity');
  assert.ok(G.inferSkill('Journal', without) === null || G.inferSkill('Journal', without).skillId !== 'sk_clarity');
});
test('resolveSkill by id, name, or name prefix', () => {
  assert.equal(G.resolveSkill(skills, 'sk_wealth').id, 'sk_wealth');
  assert.equal(G.resolveSkill(skills, 'clarity').id, 'sk_clarity');
  assert.equal(G.resolveSkill(skills, 'Dex').id, 'sk_dexterity');
  assert.equal(G.resolveSkill(skills, 'nope'), null);
  assert.equal(G.resolveSkill(skills, ''), null);
});

// ---------- completion planning ----------
group('Completing');
test('task completes once with snapshot fields, including its skill', () => {
  const st = mkState([task('t', { tier: 3, text: 'Renew passport', skillId: 'sk_upkeep' })]);
  const plan = G.planComplete(st, 't', D(2026, 9, 23, 12), { idGen });
  assert.equal(plan.completions.length, 1);
  const c = plan.completions[0];
  assert.equal(c.kind, 'task'); assert.equal(c.xp, 50); assert.equal(c.tier, 3); assert.equal(c.categoryId, 'cat_home'); assert.equal(c.skillId, 'sk_upkeep'); assert.equal(c.dayKey, '2026-09-23'); assert.equal(c.text, 'Renew passport');
  assert.deepEqual(plan.inferred, []);
  st.completions.push(...plan.completions);
  assert.equal(G.planComplete(st, 't', D(2026, 9, 23, 13), { idGen }).completions.length, 0, 'second check is a no-op');
});
test('an item with no skill gets one decided at check-off', () => {
  const st = mkState([task('t', { text: 'Journal before bed' })]);
  const plan = G.planComplete(st, 't', D(2026, 9, 23), { idGen });
  assert.equal(plan.completions[0].skillId, 'sk_clarity');
  assert.deepEqual(plan.inferred, [{ itemId: 't', skillId: 'sk_clarity' }]);
});
test('sub-tasks boost their own skill; unmatched ones fall back to the parent', () => {
  const st = mkState([
    habit('p', ALL, { text: 'Morning routine', skillId: 'sk_clarity', tier: 2 }),
    task('a', { parentId: 'p', type: 'habit', text: 'Stretch' }),
    task('b', { parentId: 'p', type: 'habit', text: 'Push-ups', skillId: 'sk_strength' }),
    task('c', { parentId: 'p', type: 'habit', text: 'Something odd' })
  ]);
  const plan = G.planComplete(st, 'p', D(2026, 9, 23), { idGen });
  assert.deepEqual(plan.completions.map(c => c.itemId + ':' + c.skillId), ['a:sk_dexterity', 'b:sk_strength', 'c:sk_clarity', 'p:sk_clarity']);
  assert.deepEqual(plan.inferred, [{ itemId: 'a', skillId: 'sk_dexterity' }, { itemId: 'c', skillId: 'sk_clarity' }]);
});
test('habit completes once per logical day, again the next day', () => {
  const st = mkState([habit('h', ALL)]);
  st.completions.push(...G.planComplete(st, 'h', D(2026, 9, 23, 12), { idGen }).completions);
  assert.equal(G.planComplete(st, 'h', D(2026, 9, 24, 1), { idGen }).completions.length, 0, '1 AM is still the same logical day');
  assert.equal(G.planComplete(st, 'h', D(2026, 9, 24, 9), { idGen }).completions.length, 1);
});
test('habit with timesPerDay 3 allows three check-ins then stops', () => {
  const st = mkState([habit('h', ALL, { timesPerDay: 3 })]);
  for (let i = 0; i < 3; i++) { const p = G.planComplete(st, 'h', D(2026, 9, 23, 12 + i), { idGen }); assert.equal(p.completions.length, 1); st.completions.push(...p.completions); }
  assert.equal(G.planComplete(st, 'h', D(2026, 9, 23, 16), { idGen }).completions.length, 0);
  assert.deepEqual(G.doneState(st.items[0], G.byId(st.items), G.indexCompletions(st.completions), '2026-09-23'), { done: true, count: 3, target: 3 });
});
test('unscheduled-day habit check-in still awards XP', () => {
  const st = mkState([habit('h', [1])]); // Mondays only
  assert.equal(G.planComplete(st, 'h', D(2026, 9, 23, 12), { idGen }).completions.length, 1); // Wednesday
});
test('last open sub-task auto-completes the parent', () => {
  const st = mkState([task('p', { tier: 3 }), task('a', { parentId: 'p', tier: 1 }), task('b', { parentId: 'p', tier: 2 })]);
  const p1 = G.planComplete(st, 'a', D(2026, 9, 23), { idGen });
  assert.equal(p1.completions.length, 1); assert.equal(p1.parentAutoCompleted, false); assert.equal(p1.completions[0].kind, 'subtask');
  st.completions.push(...p1.completions);
  const p2 = G.planComplete(st, 'b', D(2026, 9, 23), { idGen });
  assert.equal(p2.parentAutoCompleted, true);
  assert.deepEqual(p2.completions.map(c => c.itemId + ':' + c.kind + ':' + c.xp), ['b:subtask:25', 'p:task:50']);
});
test('completing a parent completes its open sub-tasks too', () => {
  const st = mkState([task('p', { tier: 2 }), task('a', { parentId: 'p', tier: 1 }), task('b', { parentId: 'p', tier: 1 })]);
  st.completions.push(...G.planComplete(st, 'a', D(2026, 9, 23), { idGen }).completions);
  const p = G.planComplete(st, 'p', D(2026, 9, 23), { idGen });
  assert.deepEqual(p.completions.map(c => c.itemId + ':' + c.kind), ['b:subtask', 'p:task']);
});
test('sub-tasks file their completion under the parent\'s list', () => {
  const st = mkState([task('p', { categoryId: 'cat_career' }), task('a', { parentId: 'p', categoryId: 'cat_home' })]);
  assert.equal(G.planComplete(st, 'a', D(2026, 9, 23), { idGen }).completions[0].categoryId, 'cat_career');
});
test('habit sub-tasks reset daily and cascade per day', () => {
  const st = mkState([habit('h', ALL, { tier: 2 }), task('s', { parentId: 'h', type: 'habit', tier: 1 })]);
  const p1 = G.planComplete(st, 's', D(2026, 9, 23), { idGen });
  assert.deepEqual(p1.completions.map(c => c.itemId + ':' + c.kind), ['s:subtask', 'h:habit']);
  st.completions.push(...p1.completions);
  assert.equal(G.planComplete(st, 's', D(2026, 9, 23, 18), { idGen }).completions.length, 0);
  const p2 = G.planComplete(st, 's', D(2026, 9, 24), { idGen });
  assert.equal(p2.completions.length, 2, 'next day both open again');
});
test('unknown item yields an empty plan', () => { assert.deepEqual(G.planComplete(mkState([]), 'zzz', D(2026, 9, 23)).completions, []); });
test('planUncomplete: task removes its completion, habit removes only today\'s latest', () => {
  const st = mkState([task('t'), habit('h', ALL, { timesPerDay: 2 })], [comp('t', '2026-09-22', { kind: 'task', id: 'ct' }), comp('h', '2026-09-22', { id: 'c1' }), comp('h', '2026-09-23', { id: 'c2', at: '2026-09-23T10:00:00.000Z' }), comp('h', '2026-09-23', { id: 'c3', at: '2026-09-23T11:00:00.000Z' })]);
  assert.deepEqual(G.planUncomplete(st, 't', D(2026, 9, 23)).removeCompletionIds, ['ct']);
  assert.deepEqual(G.planUncomplete(st, 'h', D(2026, 9, 23)).removeCompletionIds, ['c3']);
  assert.deepEqual(G.planUncomplete(st, 'h', D(2026, 9, 25)).removeCompletionIds, []);
});
test('completionsToReassign: an item\'s whole history follows its current skill', () => {
  const cs = [comp('h', '2026-09-21', { skillId: 'sk_learning' }), comp('h', '2026-09-22', { skillId: null }), comp('h', '2026-09-23', { skillId: 'sk_clarity' }), comp('other', '2026-09-23', { skillId: 'sk_learning' })];
  assert.deepEqual(G.completionsToReassign(cs, 'h', 'sk_clarity').map(c => c.dayKey), ['2026-09-21', '2026-09-22']);
  assert.equal(G.completionsToReassign(cs, 'h', null).length, 2);
});

// ---------- streaks ----------
group('Streaks');
const idx = comps => G.indexCompletions(comps);
test('consecutive daily completions', () => {
  const h = habit('h', ALL);
  const s = G.streak(h, idx(['2026-09-20', '2026-09-21', '2026-09-22'].map(d => comp('h', d))), '2026-09-22');
  assert.deepEqual(s, { current: 3, best: 3 });
});
test('today not yet done keeps the streak alive; tomorrow it is broken', () => {
  const h = habit('h', ALL);
  const cs = ['2026-09-20', '2026-09-21', '2026-09-22'].map(d => comp('h', d));
  assert.equal(G.streak(h, idx(cs), '2026-09-23').current, 3);
  assert.equal(G.streak(h, idx(cs), '2026-09-24').current, 0);
  assert.equal(G.streak(h, idx(cs), '2026-09-24').best, 3);
});
test('unscheduled days neither break nor extend', () => {
  const h = habit('h', [1, 3, 5]); // Mon Wed Fri
  const cs = ['2026-09-14', '2026-09-16', '2026-09-17', '2026-09-18'].map(d => comp('h', d)); // Mon Wed Thu(unsched) Fri
  assert.deepEqual(G.streak(h, idx(cs), '2026-09-19'), { current: 3, best: 3 }); // Saturday
  assert.equal(G.streak(h, idx(cs), '2026-09-21').current, 3, 'Monday not yet done');
  assert.equal(G.streak(h, idx(cs), '2026-09-22').current, 0, 'Monday missed');
});
test('a missed scheduled day breaks the run; best remembers the longest', () => {
  const h = habit('h', ALL);
  const cs = ['2026-09-10', '2026-09-11', '2026-09-12', '2026-09-14', '2026-09-15'].map(d => comp('h', d));
  assert.deepEqual(G.streak(h, idx(cs), '2026-09-15'), { current: 2, best: 3 });
});
test('multi-target habits count a day only when the target is hit', () => {
  const h = habit('h', ALL, { timesPerDay: 2 });
  const cs = [comp('h', '2026-09-21'), comp('h', '2026-09-21'), comp('h', '2026-09-22')];
  assert.deepEqual(G.streak(h, idx(cs), '2026-09-22'), { current: 1, best: 1 });
});
test('weekly schedule streak spans weeks', () => {
  const h = habit('h', [1], { repeat: { kind: 'weekly', days: [1] } });
  const cs = ['2026-09-07', '2026-09-14', '2026-09-21'].map(d => comp('h', d));

});

test('config.js: off when blank, checked when filled in', () => {
  assert.equal(G.syncConfig(undefined), null);
  assert.equal(G.syncConfig({ supabaseUrl: '', supabasePublishableKey: '' }), null);
  assert.deepEqual(G.syncConfig({ supabaseUrl: ' https://abcd1234.supabase.co/ ', supabasePublishableKey: 'sb_publishable_xyz' }), { url: 'https://abcd1234.supabase.co', key: 'sb_publishable_xyz' });
  assert.deepEqual(G.syncConfig({ supabaseUrl: 'http://127.0.0.1:54321', supabasePublishableKey: 'k' }), { url: 'http://127.0.0.1:54321', key: 'k' });
  assert.ok(/secret key/.test(G.syncConfig({ supabaseUrl: 'https://a.supabase.co', supabasePublishableKey: 'sb_secret_abc' }).error));
  const b64 = o => btoa(JSON.stringify(o)).replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_');
  const legacy = role => `${b64({ alg: 'HS256' })}.${b64({ role, iss: 'supabase' })}.sig`;
  assert.ok(/secret key/.test(G.syncConfig({ supabaseUrl: 'https://a.supabase.co', supabasePublishableKey: legacy('service_role') }).error), 'legacy service_role key refused');
  assert.equal(G.syncConfig({ supabaseUrl: 'https://a.supabase.co', supabasePublishableKey: legacy('anon') }).key, legacy('anon'), 'legacy anon key accepted');
  assert.ok(/should look like/.test(G.syncConfig({ supabaseUrl: 'http://a.supabase.co', supabasePublishableKey: 'k' }).error), 'plain http refused');
  assert.ok(/missing the publishable key/.test(G.syncConfig({ supabaseUrl: 'https://a.supabase.co' }).error));
  assert.equal(G.decodeJwt(legacy('anon')).role, 'anon'); assert.equal(G.decodeJwt('nope'), null);
});

  const state = {
